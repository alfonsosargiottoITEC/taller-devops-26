services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-correos-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8009}:8000"
    networks:
      - app-correos-network
    working_dir: /app
    volumes:
      - .:/app

  db:
    image: postgres:15.5-alpine
    container_name: app-correos-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    networks:
      - app-correos-network
    volumes:
      - db-data:/var/lib/postgresql/data


networks:
  app-correos-network:
    driver: bridge

volumes:
  db-data:
