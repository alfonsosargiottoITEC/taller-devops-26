services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8009}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app-correos-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-correos-network

networks:
  app-correos-network:
    driver: bridge

volumes:
  db-data:
